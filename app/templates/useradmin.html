<div id="useradmin">
  <h3>Admin Tools</h3>

  <datalist id="userlist">
    {% include "userlist.html" %}
  </datalist>

  <div>
    Enter a secret code: <input id="toggle-user" onkeyup="unspace(this)" list="userlist" style="margin-bottom: 16px;"><br>
    <button onclick="userStatus(3)">Activate</button>
    <button onclick="userStatus(1)">Deactivate</button>
    <button onclick="userStatus(2)">Reactivate at start of next motion</button><br>
    <span id="confirm-toggle"></span>
  </div>

</div>
